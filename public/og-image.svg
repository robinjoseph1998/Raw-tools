<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#070b14"/>

  <!-- Subtle grid dots -->
  <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
    <circle cx="16" cy="16" r="0.8" fill="rgba(255,255,255,0.04)"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Nebula glow -->
  <radialGradient id="glow1" cx="25%" cy="70%" r="50%">
    <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow2" cx="75%" cy="30%" r="45%">
    <stop offset="0%" stop-color="#a855f7" stop-opacity="0.1"/>
    <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Logo icon (scaled up) -->
  <g transform="translate(530, 150) scale(1.6)">
    <defs>
      <linearGradient id="fg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#818cf8"/>
        <stop offset="50%" stop-color="#06b6d4"/>
        <stop offset="100%" stop-color="#22d3ee"/>
      </linearGradient>
      <linearGradient id="fb" x1="0" y1="16" x2="64" y2="48" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#a78bfa"/>
        <stop offset="100%" stop-color="#22d3ee"/>
      </linearGradient>
    </defs>
    <rect x="3" y="3" width="58" height="58" rx="14" stroke="url(#fg)" stroke-width="3" fill="#070b14" opacity="0.9"/>
    <path d="M22 16c-4 0-6 2-6 5v7c0 3-2 4-4 4 2 0 4 1 4 4v7c0 3 2 5 6 5" stroke="url(#fb)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M42 16c4 0 6 2 6 5v7c0 3 2 4 4 4-2 0-4 1-4 4v7c0 3-2 5-6 5" stroke="url(#fb)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M25 27l6 5-6 5" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="34" y1="37" x2="41" y2="37" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Title -->
  <text x="600" y="380" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="#f4f4f5" letter-spacing="-1">RAW</text>

  <!-- Subtitle -->
  <text x="600" y="425" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#a1a1aa">Developer Toolkit</text>

  <!-- Tagline -->
  <text x="600" y="480" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="#52525b">28 Free Browser-Based Tools  ·  100% Client-Side</text>

  <!-- Bottom accent line -->
  <linearGradient id="accent" x1="300" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="transparent"/>
    <stop offset="30%" stop-color="#22d3ee" stop-opacity="0.4"/>
    <stop offset="70%" stop-color="#a855f7" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="transparent"/>
  </linearGradient>
  <rect x="300" y="520" width="600" height="1" fill="url(#accent)"/>

  <!-- URL -->
  <text x="600" y="560" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#3f3f46">rawtools.site</text>
</svg>
